name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  data-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Checks find exactly the planted defects
        working-directory: data-validation
        run: python -m pytest -q

  ai-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Evaluator tests
        working-directory: ai-eval
        run: python -m pytest -q
      - name: Release gate report for model v2 (expected to block)
        working-directory: ai-eval
        # The gate exits 1 when it blocks a release. Here it must block v2, so a
        # pass would mean the gate is broken.
        run: '! python evaluator.py outputs/model_v2.json --baseline outputs/model_v1.json'

  web-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web-api/playwright-report
          retention-days: 14
